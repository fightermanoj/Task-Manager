<!-- App icon: a terminal prompt on the app's own dark ground (#0d1117, the dark
     GUI palette's bg-page token) with the terminal green from the terminal-dark
     accent-green token. Single source of truth: the PNGs in icons/ are
     generated from this file by "npm run icons".

     The mark lives in a named group so scripts/generate-icons.js can scale it
     for the maskable variant without duplicating the artwork.

     Note: XML comments may not contain a double hyphen, so the CSS custom
     property names above are written without their leading dashes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0d1117"/>
  <g id="mark">
    <path d="M140 168 L248 256 L140 344"
          fill="none" stroke="#39d353" stroke-width="40"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="288" y="316" width="112" height="40" rx="20" fill="#39d353"/>
  </g>
</svg>
